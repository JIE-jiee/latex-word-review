[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "latex-word-review"
dynamic = ["version"]
description = "Auditable, approval-gated LaTeX and Word review bridge for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "LaTeX Word Review contributors" },
]
keywords = [
  "docx",
  "latex",
  "review",
  "tracked-changes",
  "word",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "jsonschema>=4.26,<5",
  "lxml>=6.1,<7",
  "referencing>=0.37,<1",
  "regex>=2026.7.10,<2027",
  "rfc8785>=0.1.4,<0.2",
  "tex2word==1.0.6",
]

[project.urls]
Homepage = "https://github.com/JIE-jiee/latex-word-review"
Repository = "https://github.com/JIE-jiee/latex-word-review"
Documentation = "https://github.com/JIE-jiee/latex-word-review/tree/main/docs"
Issues = "https://github.com/JIE-jiee/latex-word-review/issues"
Changelog = "https://github.com/JIE-jiee/latex-word-review/blob/main/CHANGELOG.md"

[project.optional-dependencies]
citations = [
  "citeproc-py>=0.10,<0.11",
  "tex2word[csl]==1.0.6",
]
math-fallback = [
  "kiwisolver>=1.4.8,<1.6",
  "latex2mathml>=3.77,<4",
  "matplotlib>=3.11.1,<3.12",
  "tex2word[mathimg,mathml]==1.0.6",
]
pdf-figures = [
  "pillow>=12,<13",
  "pypdfium2>=5.12.1,<6",
  "tex2word[pdf]==1.0.6",
]

[project.scripts]
latex-word-review = "latex_word_review.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling==1.31.0",
  "mypy>=1.14,<3",
  "pip>=25,<27",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16.1,<1",
  "setuptools==83.0.0",
  "twine>=6,<8",
  "types-jsonschema>=4.26.0.20260518,<4.27",
  "wheel==0.47.0",
]
fixture = [
  "pillow>=12,<13",
  "python-docx>=1.2,<2",
]
browser-e2e = [
  "playwright==1.62.0",
  "pytest>=8.3,<10",
]
release = [
  "pyinstaller==6.21.0",
]

[tool.hatch.version]
path = "src/latex_word_review/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/.agents",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/docs",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/skills",
  "/plugins",
  "/SUPPORT.md",
  "/third_party",
  "/THIRD_PARTY_NOTICES.md",
  "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latex_word_review"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["latex_word_review"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["build", "scripts"]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/latex_word_review", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true
