name: Real TeX closed-loop gate
description: Install the bounded Windows MiKTeX toolchain and run the non-skippable public E2E branch.

runs:
  using: composite
  steps:
    - name: Download and verify the official MiKTeX Setup Utility
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $archive = Join-Path $env:RUNNER_TEMP "miktexsetup-5.5.0+1763023-x64.zip"
        $setupRoot = Join-Path $env:RUNNER_TEMP "latex-word-review-miktex-setup"
        Invoke-WebRequest `
          -Uri "https://miktex.org/download/ctan/systems/win32/miktex/setup/windows-x64/miktexsetup-5.5.0+1763023-x64.zip" `
          -OutFile $archive
        $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        $expected = "0571e90f6d94353089b4f189fd82a532f9fe559a388c7e7f1102b14b3c1ae27d"
        if ($actual -ne $expected) {
          throw "MiKTeX Setup Utility SHA-256 mismatch"
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $setupRoot
        $setups = @(Get-ChildItem -LiteralPath $setupRoot -Recurse -File -Filter "miktexsetup_standalone.exe")
        if ($setups.Count -ne 1) {
          throw "Verified MiKTeX archive did not contain exactly one setup utility"
        }
        "MIKTEX_SETUP=$($setups[0].FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "MIKTEX_SETUP_FILENAME=$(Split-Path -Leaf $archive)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "MIKTEX_SETUP_SHA256=$actual" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install the official basic MiKTeX package set for this runner
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $repository = Join-Path $env:RUNNER_TEMP "latex-word-review-miktex-repository"
        $install = Join-Path $env:RUNNER_TEMP "latex-word-review-miktex-install"
        $config = Join-Path $env:RUNNER_TEMP "latex-word-review-miktex-config"
        $data = Join-Path $env:RUNNER_TEMP "latex-word-review-miktex-data"
        & $env:MIKTEX_SETUP `
          "--local-package-repository=$repository" `
          --package-set=basic `
          download
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX package-set download failed" }
        & $env:MIKTEX_SETUP `
          "--local-package-repository=$repository" `
          --package-set=basic `
          --shared=no `
          "--user-install=$install" `
          "--user-config=$config" `
          "--user-data=$data" `
          --use-registry=no `
          --modify-path=no `
          install
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX installation failed" }
        $executables = @(Get-ChildItem -LiteralPath $install -Recurse -File -Filter "miktex.exe")
        if ($executables.Count -ne 1) {
          throw "MiKTeX installation did not contain exactly one miktex.exe"
        }
        $executables[0].DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
        "MIKTEX_USERINSTALL=$install" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "MIKTEX_USERCONFIG=$config" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "MIKTEX_USERDATA=$data" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install and verify the fixed MiKTeX package set
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $report = & initexmf --report
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX configuration report failed" }
        $expected = @{
          Configuration = "Regular"
          SharedSetup = "no"
          PathOkay = "yes"
          UserInstall = $env:MIKTEX_USERINSTALL
          UserConfig = $env:MIKTEX_USERCONFIG
          UserData = $env:MIKTEX_USERDATA
        }
        foreach ($name in $expected.Keys) {
          $pattern = '^{0}:\s+{1}\s*$' -f [regex]::Escape($name), [regex]::Escape($expected[$name])
          if (@($report | Where-Object { $_ -match $pattern }).Count -ne 1) {
            throw "MiKTeX configuration mismatch: $name"
          }
        }
        miktex packages update-package-database
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX package database update failed" }
        $packageManifest = Join-Path `
          $env:GITHUB_WORKSPACE `
          ".github/actions/real-tex-gate/miktex-packages.txt"
        $packages = @(
          Get-Content -LiteralPath $packageManifest -Encoding utf8 |
            Where-Object { $_ -ne "" }
        )
        $normalizedPackages = @($packages | Sort-Object -Unique)
        if (
          $packages.Count -ne 29 -or
          ($packages -join "`n") -ne ($normalizedPackages -join "`n") -or
          @($packages | Where-Object { $_ -notmatch '^[a-z0-9][a-z0-9+._-]*$' }).Count -ne 0
        ) {
          throw "MiKTeX package manifest is malformed"
        }
        miktex packages require @packages
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX package requirement failed" }
        miktex --disable-installer fndb refresh
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX filename database refresh failed" }
        miktex --disable-installer links install
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX executable-link refresh failed" }
        miktex --disable-installer fontmaps configure
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX font-map configuration failed" }
        miktex --disable-installer formats build xelatex
        if ($LASTEXITCODE -ne 0) { throw "XeLaTeX format build failed" }
        miktex --disable-installer packages verify @packages
        if ($LASTEXITCODE -ne 0) { throw "MiKTeX package verification failed" }
    - name: Warm the fixed XeLaTeX and Fandol caches without package installation
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $warmupRoot = Join-Path $env:RUNNER_TEMP "latex-word-review-xelatex-warmup"
        New-Item -ItemType Directory -Path $warmupRoot | Out-Null
        $warmupSource = @'
        \documentclass{article}
        \usepackage[UTF8,fontset=fandol]{ctex}
        \begin{document}
        Bounded public cache warm-up. 固定公开缓存预热。
        \end{document}
        '@
        Set-Content `
          -LiteralPath (Join-Path $warmupRoot "main.tex") `
          -Value $warmupSource `
          -Encoding utf8 `
          -NoNewline
        Push-Location $warmupRoot
        try {
          xelatex `
            --disable-installer `
            -interaction=nonstopmode `
            -halt-on-error `
            -file-line-error `
            -no-shell-escape `
            ./main.tex
          if ($LASTEXITCODE -ne 0) { throw "Fixed XeLaTeX cache warm-up failed" }
        }
        finally {
          Pop-Location
        }
        if (-not (Test-Path -LiteralPath (Join-Path $warmupRoot "main.pdf") -PathType Leaf)) {
          throw "Fixed XeLaTeX cache warm-up did not produce a PDF"
        }
    - name: Verify tools and run exactly one real TeX E2E case
      shell: pwsh
      run: >-
        uv run --frozen --python 3.12 python
        .github/scripts/run_real_tex_gate.py
        --output-dir build/real-tex
